<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeonChat // Gateway</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-deep: #0a0a0d;
            --bg-surface: #111116;
            --bg-panel: #181822;
            --neon-cyan: #00ffcc;
            --neon-magenta: #ff007f;
            --text-pure: #ffffff;
            --text-dark: #7e7e8c;
            --font-display: 'Orbitron', sans-serif;
            --font-sans: 'Poppins', sans-serif;
        }

        * { margin:0; padding:0; box-sizing:border-box; font-family: var(--font-sans); }
        body { background-color: var(--bg-deep); color: var(--text-pure); height: 100vh; display: flex; overflow: hidden; }

        .app-layout { display: flex; width: 100%; height: 100vh; }

        /* SIDEBAR */
        .sidebar { width: 300px; background-color: var(--bg-surface); display: flex; flex-direction: column; border-right: 1px solid rgba(0, 255, 204, 0.1); }
        .server-header { padding: 20px; font-family: var(--font-display); font-size: 1.1rem; color: var(--neon-cyan); letter-spacing: 2px; border-bottom: 1px solid rgba(255,255,255,0.05); text-shadow: 0 0 8px rgba(0,255,204,0.3); }
        .section-label { padding: 20px 20px 8px 20px; font-size: 0.75rem; font-family: var(--font-display); color: var(--text-dark); letter-spacing: 1px; text-transform: uppercase; }
        .list-stack { flex: 1; overflow-y: auto; padding: 0 10px; }
        
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 6px; cursor: pointer; color: var(--text-dark); transition: all 0.2s ease; margin-bottom: 4px; }
        .nav-item:hover, .nav-item.active { background-color: var(--bg-panel); color: var(--text-pure); }
        .nav-item.active { border-left: 3px solid var(--neon-cyan); box-shadow: inset 5px 0 10px rgba(0,255,204,0.05); }
        
        .status-indicator { width: 8px; height: 8px; background-color: #3ba55d; border-radius: 50%; box-shadow: 0 0 6px #3ba55d; }

        /* USER DECK */
        .user-deck { background-color: var(--bg-panel); padding: 15px; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid rgba(255,255,255,0.05); }
        .identity { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, var(--neon-magenta), var(--neon-cyan)); display: flex; align-items: center; justify-content: center; font-weight: bold; font-family: var(--font-display); border: 1px solid rgba(255,255,255,0.2); }

        /* MAIN SOHBET */
        .chat-viewport { flex: 1; display: flex; flex-direction: column; background-color: var(--bg-deep); }
        .top-nav { height: 65px; padding: 0 25px; display: flex; align-items: center; justify-content: space-between; background-color: var(--bg-surface); border-bottom: 1px solid rgba(0, 255, 204, 0.1); }
        .top-nav h2 { font-family: var(--font-display); font-size: 1rem; letter-spacing: 1px; }
        
        .voice-badge { display: flex; align-items: center; gap: 15px; background: rgba(0, 255, 204, 0.08); padding: 8px 16px; border-radius: 4px; border: 1px solid rgba(0, 255, 204, 0.2); font-size: 0.85rem; }
        .hangup { color: var(--neon-magenta); font-weight: bold; cursor: pointer; margin-left: 5px; }

        .scroller { flex: 1; padding: 25px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
        .msg-row { display: flex; gap: 15px; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .msg-body h5 { font-size: 0.9rem; font-weight: 600; margin-bottom: 3px; }
        .msg-body h5 span { font-size: 0.75rem; color: var(--text-dark); margin-left: 10px; font-weight: 300; }
        .msg-body p { color: #d0d0d9; font-size: 0.95rem; line-height: 1.5; }

        .composer { padding: 25px; background-color: var(--bg-deep); }
        .term-input { width: 100%; background-color: var(--bg-surface); border: 1px solid rgba(255,255,255,0.08); padding: 16px 20px; border-radius: 6px; color: var(--text-pure); outline: none; transition: border 0.2s; }
        .term-input:focus { border-color: var(--neon-cyan); box-shadow: 0 0 10px rgba(0,255,204,0.1); }

        /* RIGHT PANEL */
        .right-panel { width: 250px; background-color: var(--bg-surface); border-left: 1px solid rgba(0, 255, 204, 0.1); }

        /* GATEWAY LOCK (MODAL) */
        .gateway-overlay { position: fixed; inset: 0; background-color: rgba(5, 5, 8, 0.95); backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .gateway-form { background-color: var(--bg-surface); width: 440px; padding: 45px; border-radius: 8px; border: 1px solid rgba(0, 255, 204, 0.2); box-shadow: 0 0 30px rgba(0,255,204,0.1); text-align: center; }
        .gateway-form h3 { font-family: var(--font-display); font-size: 1.6rem; margin-bottom: 8px; letter-spacing: 1px; }
        .oauth-btn { width: 100%; background-color: var(--text-pure); color: var(--bg-deep); border: none; padding: 14px; border-radius: 4px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 20px; transition: opacity 0.2s; }
        .oauth-btn:hover { opacity: 0.9; }
        .separator { margin: 20px 0; color: var(--text-dark); font-size: 0.8rem; font-family: var(--font-display); position: relative; }
        .field { text-align: left; margin-bottom: 20px; }
        .field label { display: block; font-size: 0.75rem; font-family: var(--font-display); color: var(--text-dark); margin-bottom: 8px; letter-spacing: 1px; }
        .action-btn { width: 100%; background: linear-gradient(90deg, #7928ca, #5865F2); color: white; border: none; padding: 14px; border-radius: 4px; font-weight: 600; cursor: pointer; font-family: var(--font-display); letter-spacing: 1px; }
    </style>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

    <div class="gateway-overlay" id="authGate">
        <div class="gateway-form">
            <h3>INITIALIZE CONNECTION</h3>
            <p style="color: var(--text-dark); font-size: 0.85rem; margin-bottom: 25px;">Sisteme erişim yetkisi doğrulaması gerekiyor.</p>
            
            <button class="oauth-btn" onclick="triggerGoogleAuth()">
                <img src="https://fonts.gstatic.com/s/i/productlogos/googleg/v6/web-24dp/logo_googleg_color_24dp.png" width="18">
                Google Hesabı ile Bağlan
            </button>

            <div class="separator">// VEYA KLASİK PANEL</div>

            <form onsubmit="executeLogin(event)">
                <div class="field">
                    <label>Kullanıcı Kimliği (Username)</label>
                    <input type="text" id="aliasInput" class="term-input" required placeholder="Örn: KenanLo">
                </div>
                <button type="submit" class="action-btn">Erişim Sağla</button>
            </form>
        </div>
    </div>

    <div class="app-layout">
        <div class="sidebar">
            <div class="server-header"><i class="fa-solid fa-terminal"></i> NEON_NET</div>
            
            <div class="section-label">Ses Kanalları</div>
            <div class="list-stack">
                <div class="nav-item" id="v-room-1" onclick="joinVoice('Genel Ses Odası', 'v-room-1')">
                    <i class="fa-solid fa-headset"></i> Genel Ses Odası
                </div>
                <div class="nav-item" id="v-room-2" onclick="joinVoice('Gaming Odası', 'v-room-2')">
                    <i class="fa-solid fa-gamepad"></i> Gaming Odası
                </div>
            </div>

            <div class="section-label">Aktif Ekip (Partnerler)</div>
            <div class="list-stack">
                <div class="nav-item"><div class="status-indicator"></div> Nurullah (Partner)</div>
                <div class="nav-item"><div class="status-indicator"></div> Ömer (Expert)</div>
            </div>

            <div class="user-deck">
                <div class="identity">
                    <div class="avatar" id="myAv">-</div>
                    <div>
                        <div id="myUid" style="font-size: 0.9rem; font-weight: 600;">Misafir</div>
                        <div style="font-size: 0.75rem; color: var(--text-dark);">#ONLINE</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="chat-viewport">
            <div class="top-nav">
                <h2><i class="fa-solid fa-hashtag" style="color: var(--neon-cyan)"></i> genel-sohbet</h2>
                <div class="voice-badge" id="voiceIndicator" style="display: none;">
                    <span><i class="fa-solid fa-satellite-dish" style="color: var(--neon-cyan)"></i> <span id="currentRoomTag">Oda</span></span>
                    <span class="hangup" onclick="leaveVoice()">[ AYRIL ]</span>
                </div>
            </div>

            <div class="scroller" id="chatStream"></div>

            <div class="composer">
                <input type="text" class="term-input" id="messageField" placeholder="# genel-sohbet kanalına kriptolu mesaj gönder..." onkeypress="pushMessage(event)">
            </div>
        </div>

        <div class="right-panel">
            <div class="section-label">Sesteki Kullanıcılar</div>
            <div class="list-stack" id="voiceUserStack">
                <div style="padding: 12px; font-size: 0.85rem; color: var(--text-dark);">Kanal boş.</div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
